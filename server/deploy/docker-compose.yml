# podkop-server + 3x-UI + nginx.
#
# podkop-server serves two things from one binary:
#   * the public Halogen devlog on "/" — a real site, and the cover the operator
#     area lives behind,
#   * the operator area on the secret PODKOP_SERVER_ADMIN_PATH: the devlog CMS
#     plus the podkop panel under its Extras tab.
#
# Pick exactly one way to reach it from a browser:
#
#   A. Dedicated port + TLS  — `docker compose --profile public up -d`
#      nginx terminates TLS on 8443 and proxies to the panel (443 is usually
#      taken by an Xray Reality inbound, so the panel cannot sit there).
#      Set PODKOP_SERVER_BIND=127.0.0.1 and PODKOP_SERVER_TRUSTED_PROXY=1.
#
#   B. Cloudflare tunnel     — `docker compose --profile tunnel up -d`
#      Nothing is published at all; cloudflared dials out and Cloudflare
#      terminates TLS. Set PODKOP_SERVER_TRUSTED_PROXY=1 so the login throttle
#      sees real client addresses instead of the tunnel's.
#
#   C. Tunnel-only (no browser access from the internet)
#      Leave both profiles off: the panel stays on PODKOP_SERVER_BIND and is
#      reachable only from the VPS itself or through your own VPN. Pair it with
#      PODKOP_SERVER_ROOT=decoy if you want the old camouflage page back.
#
# Copy .env.example to .env and fill it in before `docker compose up -d`.

services:
  podkop-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PODKOP_SERVER_LISTEN: ":8080"
      PODKOP_SERVER_STORE: "/var/lib/podkop-server/store.json"
      XUI_BASE_URL: "http://3x-ui:2053"
    volumes:
      - podkop_data:/var/lib/podkop-server
    networks:
      - internal
      # AWG path via docker networking — see the `awg` network at the bottom.
      #- awg
    # Never "8080:8080" — that would publish the panel on every interface.
    # PODKOP_SERVER_BIND pins it to one address (loopback by default); public
    # access is supposed to arrive through nginx or the tunnel.
    ports:
      - "${PODKOP_SERVER_BIND:-127.0.0.1}:8080:8080"

  # Profile A: TLS front end on 8443.
  nginx:
    image: nginx:1.27-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on: [podkop-server]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Put fullchain.pem / privkey.pem here (certbot, acme.sh, …).
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"
    networks: [internal]

  # Profile B: outbound-only tunnel, no ports opened on the VPS.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [podkop-server]
    # The token goes through the environment rather than the command line:
    # argv is visible to anything that can run `ps` or `docker inspect`.
    # It is also not marked required — compose interpolates every service in
    # the file regardless of profiles, so a missing token here would break
    # plain `docker compose ps` for everyone. cloudflared reports the empty
    # token itself when this profile is actually started.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    networks: [internal]

  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    profiles: ["xui"]
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    volumes:
      - xui_db:/etc/x-ui
      - xui_cert:/root/cert
    networks: [internal]
    # Xray inbound ports must be published so clients can connect. Adjust to the
    # ports of the inbound you create in 3x-UI (e.g. 443 for VLESS-Reality).
    # Leave this commented out if another Xray (e.g. Amnezia's) already owns 443.
    #ports:
    #  - "443:443"
    expose:
      - "2053"

volumes:
  podkop_data:
  xui_db:
  xui_cert:

networks:
  internal:
    driver: bridge
  # AWG path via docker networking: uncomment both the network below and the
  # `awg` entry in podkop-server.networks, and set `name` to the network of your
  # AmneziaWG container (`docker network ls`). The panel then answers on its
  # address inside that network — check it with
  # `docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' <container>`.
  #awg:
  #  external: true
  #  name: amnezia-awg_default
