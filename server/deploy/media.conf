# Static assets for the devlog — screenshots and video too big to ship inside
# the binary. Reached only through the tunnel, so there is no TLS here and no
# port published: Cloudflare terminates TLS at its edge and caches what it gets.
#
# The origin address stays hidden precisely because this is not a grey-cloud
# host: a reader loading a post never opens a connection to the VPS.

server {
    listen 80;
    server_name _;

    root /srv/media;
    autoindex off;
    charset utf-8;

    # Nothing here is generated, so let the edge and the browser keep it. Assets
    # are versioned by filename — overwrite in place and the old copy lingers,
    # so publish changes under a new name.
    location / {
        # Cache-Control is set here rather than with `expires`, which would emit
        # its own header and leave two of them on every response.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Serve media, refuse everything else. A stray .php or .env dropped in
        # this directory should 404 rather than be handed out.
        location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|mov|m4v|ogg|mp3|wav|woff2?|pdf)$ {
            try_files $uri =404;
        }
        return 404;
    }

    # Dotfiles never belong in a public asset directory.
    location ~ /\. {
        deny all;
    }

    # Cheap liveness check for the tunnel, no body.
    location = /healthz {
        access_log off;
        return 204;
    }
}
