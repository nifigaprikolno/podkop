# Reverse proxy in front of podkop-server.
#
# All public traffic goes to podkop-server, which serves the decoy site on "/",
# the operator panel on the secret admin path, and /api/v1/* for routers.
# 3x-UI is intentionally not proxied here — it stays on the internal network.

upstream podkop_server {
    server podkop-server:8080;
}

server {
    listen 80;
    server_name _;

    # If you enable the TLS block below, redirect plain HTTP to HTTPS instead:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://podkop_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

