# TLS front end for podkop-server (compose profile "public").
#
# Listens on 443 inside the container, published on the host as 8443 — port 443
# on the host is normally taken by an Xray Reality inbound, and a second server
# cannot share it: Reality answers every SNI and forwards what it does not
# recognise to its masquerade target.
#
# Everything goes to podkop-server: the public devlog on "/", the operator area
# on the secret admin path, and /api/v1/* for routers. 3x-UI is intentionally
# not proxied here — it stays on the internal network.
#
# Put fullchain.pem / privkey.pem into ./certs and set your domain below.
# Remember PODKOP_SERVER_TRUSTED_PROXY=1 in .env, otherwise the login throttle
# sees this container's address instead of the visitor's.

upstream podkop_server {
    server podkop-server:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The panel is small and server-rendered; a low body limit keeps junk out.
    client_max_body_size 1m;

    location / {
        proxy_pass http://podkop_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
